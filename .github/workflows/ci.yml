name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check src tests scripts
      - name: Format (ruff format --check)
        run: ruff format --check src tests scripts
      - name: Type check (mypy)
        run: mypy src
      - name: Domain purity gate (no forbidden imports)
        run: python scripts/check_domain_purity.py
      - name: Layer boundary gate (dependency direction + port declarations)
        run: python scripts/check_layer_boundaries.py
      - name: Docs validation
        run: python scripts/validate_docs.py
      - name: Unit tests + coverage
        run: pytest -m unit -q --cov=aegis --cov-report=term-missing
      - name: Contract tests (SDK <-> API parity + OpenAPI snapshot)
        run: pytest -m contract -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests (Postgres + Redis services)
        run: pytest -m integration -q
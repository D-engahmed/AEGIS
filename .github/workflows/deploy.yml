name: Deploy to VPS

# Deploys the aegis image to a Linux VPS over SSH after CI passes on main.
#
# Required repository secrets:
#   VPS_HOST      - server hostname/IP
#   VPS_USER      - SSH user (must be able to run docker)
#   VPS_PORT      - SSH port (default 22)
#   VPS_SSH_KEY   - SSH private key (ed25519 or RSA)
#
# Optional:
#   AEGIS_TAG     - image tag (defaults to "latest")

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            APP_DIR="${AEGIS_APP_DIR:-/opt/aegis}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              git -C "$APP_DIR" fetch --all --prune
              git -C "$APP_DIR" checkout main
              git -C "$APP_DIR" reset --hard origin/main
            fi
            cd "$APP_DIR"
            AEGIS_TAG=${AEGIS_TAG:-latest} docker compose up -d --build
            docker compose ps
